[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-pipeline"
version = "0.1.0"
description = "흡연 여부 예측 파이프라인을 위한 데이터 품질 QA 게이트"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pandera>=0.20",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
